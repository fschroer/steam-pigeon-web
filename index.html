<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Steam Pigeon Flights</title>
    <script>
      // Before first paint, so the page never flashes light. Dark unless the
      // viewer chose otherwise; "system" follows the OS.
      (function () {
        var t = 'dark';
        try { t = localStorage.getItem('sp.theme') || 'dark'; } catch (e) {}
        if (t !== 'system') document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <header class="top">
      <a class="brand" href="#/">Steam Pigeon Flights</a>
      <div class="top-right">
        <button type="button" id="units" class="link"></button>
        <button type="button" id="theme" class="link"></button>
        <div id="who"></div>
      </div>
    </header>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
